# @package _global_
# Output layout shared by every experiment:
#   outputs/runs/<dataset>/<framework>_<method>/<algorithm>/<variant>/seed_<n>/
# `algorithm` comes from _target_, so a saved config still resolves outside Hydra
# (tools/test.py reloads them). `variant` tells untuned and tuned runs apart.
algorithm: ${basename:${optimizer._target_}}
variant: baseline
run_rel: runs/${dataset.name}/${framework}_${method}/${algorithm}/${variant}/seed_${seed}
run_dir: outputs/${run_rel}
exp_name: ${framework}_${method}_${algorithm}_${variant}_${dataset.name}
save_path: ${run_dir}
# tools/hpo.py turns this off for search trials.
save_checkpoint: true

hydra:
  job:
    name: ${exp_name}
  run:
    dir: ${run_dir}
  # Hydra resolves sweep.dir once per sweep and subdir once per job, so the per-run
  # path goes in subdir.
  sweep:
    dir: outputs
    subdir: ${run_rel}
