# MNIST CNN trained by evosax. fitness_batch_size is required: the full 50K-image
# training set times the population doesn't fit in GPU memory.
framework: jax
method: NE
seed: 0
generations: 300
eval_every_gen: 10
fitness_batch_size: 256
init_std_multiplier: 1.0
es_learning_rate: 0.001

defaults:
  - base/run_layout
  - trainer: jax/es_trainer
  - dataset: mnist
  - model: jax/cnn_mnist
  - optimizer: jax/sep_cma_es
  - loss: jax/cross_entropy
  - _self_
