# Reproduces (in JAX) the MLP baseline trained on California Housing from
# Gorishniy et al. (2021), "Revisiting Deep Learning Models for Tabular Data",
# using gradient-based optimizers. Default hyperparameters below are the paper's
# tuned values for AdamW (see model/jax/mlp_california.yaml for the source).
framework: jax
method: SGD
seed: 0
learning_rate: 0.001304086404538407
weight_decay: 0.0001516844843295127
epochs: 200
eval_every: 1

defaults:
  - base/run_layout
  - trainer: jax/sgd_trainer
  - dataset: tabm_california
  - model: jax/mlp_california
  - optimizer: jax/adamw
  - loss: jax/mse
  - _self_
# It is recommended to sweep parameters through the scripts or command line
