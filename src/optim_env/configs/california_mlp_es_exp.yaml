# Same MLP/California Housing setup as california_mlp_sgd_exp.yaml, trained with
# evosax evolutionary-strategy optimizers instead of gradient descent. ES training
# is full-batch per generation (see ESTrainer), so batch_size in the dataset config
# is unused here.
# Default optimizer is sep_cma_es (diagonal-covariance CMA-ES), not the full-covariance
# cma_es used elsewhere in this repo: mlp_california has ~235K parameters, and full CMA-ES's
# O(D^2) covariance matrix would need ~220GB at that dimensionality.
framework: jax
method: NE
seed: 0
generations: 300
eval_every_gen: 10
# Hyperparameter-optimization hooks (see ESTrainer.prepare_model / tools/hpo.py). Defaults
# below reproduce the plain, non-HPO behavior: init_std_multiplier=1.0 keeps the
# model-matched scale as-is, and es_learning_rate=1e-3 matches evosax's own default for
# algorithms with an internal optimizer (Open_ES, PGPE, SNES, ARS; ignored otherwise).
init_std_multiplier: 1.0
es_learning_rate: 0.001

defaults:
  - base/run_layout
  - trainer: jax/es_trainer
  - dataset: tabm_california
  - model: jax/mlp_california
  - optimizer: jax/sep_cma_es
  - loss: jax/mse
  - _self_
# It is recommended to sweep parameters through the scripts or command line
