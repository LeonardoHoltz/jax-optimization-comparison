# Same MLP architecture and paper-tuned hyperparameters as california_mlp_sgd_exp.yaml
# (see model/jax/mlp_california.yaml for the source/citation). dataset.framework: torch
# below is what makes the shared DataModule hand out torch tensors instead of jax arrays
# (see datasets/default.py).
framework: torch
method: SGD
seed: 0
learning_rate: 0.001304086404538407
weight_decay: 0.0001516844843295127
epochs: 200
eval_every: 1

defaults:
  - base/run_layout
  - trainer: torch/sgd_trainer
  - dataset: tabm_california
  - model: torch/mlp_california
  - optimizer: torch/adamw
  - loss: torch/mse
  - _self_

dataset:
  framework: torch
# It is recommended to sweep parameters through the scripts or command line
