# California Housing as distributed in data/tabm/california, i.e. the exact
# train/val/test split used by Gorishniy et al. (2021) ("Revisiting Deep Learning
# Models for Tabular Data") and its follow-up TabM benchmark, rather than a fresh
# random split of the raw sklearn fetch. The fixed split is kept as-is; val_split is
# unused here.
_target_: optim_env.datasets.tabm.TabMDataModule
name: california
num_features: 8
num_classes: 0
root: data/tabm
val_split: 0.2
batch_size: 256
seed: ${seed}
normalize: true
