# PyTorch mirror of model/mlp_california.yaml -- same architecture and paper-tuned
# hyperparameters (see that file for the source/citation), targeting the native
# PyTorch MLP (jax_optim_env.torch_env.models.linear.MLP) instead of the Flax one.
_target_: jax_optim_env.torch_env.models.linear.MLP
din: ${dataset.num_features}
hidden_dims: [510, 263, 363]
dout: ${max:${dataset.num_classes},1}
dropout: 0.1973063643675128
