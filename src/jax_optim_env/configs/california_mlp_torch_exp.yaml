# PyTorch mirror of california_mlp_sgd_exp.yaml -- same MLP architecture and paper-tuned
# hyperparameters (see model/mlp_california.yaml for the source/citation), trained with
# native PyTorch (torch.optim, jax_optim_env.torch_env.trainers.sgd_trainer.SGDTrainer)
# instead of JAX/Flax/optax. dataset.framework: torch below is what makes the shared
# DataModule hand out torch tensors instead of jax arrays (see datasets/default.py).
exp_name: "TORCH_${optimizer._target_}_california"
save_path: outputs/${exp_name}
seed: 0
hooks: []
learning_rate: 0.001304086404538407
weight_decay: 0.0001516844843295127
epochs: 200
eval_every: 1

defaults:
  - trainer: torch_sgd_trainer
  - dataset: tabm_california
  - model: torch_mlp_california
  - optimizer: torch_adamw
  - loss: torch_mse
  - _self_

dataset:
  framework: torch

hydra:
  job:
    name: ${exp_name}
  run:
    dir: outputs/${exp_name}
  # Multirun setup for optimizers/seeds
  sweep:
    dir: outputs/${exp_name}
    subdir: "."
  # It is recommended to sweep parameters through the scripts or command line
