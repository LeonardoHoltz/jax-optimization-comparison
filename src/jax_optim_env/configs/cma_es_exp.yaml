exp_name: jax_NE_${basename:${optimizer._target_}}_${dataset.name}
save_path: outputs/${exp_name}
seed: 42
hooks: []
learning_rate: 0.001
generations: 100
eval_every_gen: 10

defaults:
  - trainer: jax/es_trainer
  - dataset: pmlb_mushroom
  - model: jax/linear
  - optimizer: jax/cma_es
  - loss: jax/cross_entropy
  - _self_

hydra:
  job:
    name: ${exp_name}
  run:
    dir: outputs/${exp_name}
  # Multirun setup for seeds
  sweep:
    dir: outputs/${exp_name}
    subdir: "."
  # It is recommended to sweep parameters through the scripts or command line