# Reproduces (in JAX) the MLP baseline trained on California Housing from
# Gorishniy et al. (2021), "Revisiting Deep Learning Models for Tabular Data",
# using gradient-based optimizers. Default hyperparameters below are the paper's
# tuned values for AdamW (see model/mlp_california.yaml for the source).
exp_name: "SGD_${optimizer._target_}_california"
save_path: outputs/${exp_name}
seed: 0
hooks: []
learning_rate: 0.001304086404538407
weight_decay: 0.0001516844843295127
epochs: 200
eval_every: 1

defaults:
  - trainer: sgd_trainer
  - dataset: sklearn_california_housing
  - model: mlp_california
  - optimizer: adamw
  - loss: mse
  - _self_

hydra:
  job:
    name: ${exp_name}
  run:
    dir: outputs/${exp_name}
  # Multirun setup for optimizers/seeds
  sweep:
    dir: outputs/${exp_name}
  # It is recommended to sweep parameters through the scripts or command line
